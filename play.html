<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gro</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Simon<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="scores.html">Scores</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <!-- This is where the websocket would connect to get live scores from other players and placed in the connected ul section-->
      <div class="players">
        Player:
        <span class="player-name">Its you</span>
      </div>
      <ul class="notification">
        <li class="player-name">Tim: $123.45</li>
        <li class="player-name">Ada: $678.90</li>
        <li class="player-name">You: $123.45</li>
      </ul>

      <!-- More formatting with old style HTML -->
      <br />

      <div>
        <label for="count">Score</label>
        <input type="text" id="count" value="--" readonly />
      </div>

      <br />

      <div>
        <button>Reset</button>
      </div>

      <br />

      <div>
        <button>Buy</button>
        <button>Sell</button>
      </div>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Ethan Geslison</span>
      <br />
      <a href="https://github.com/fiercestnewt/startup">GitHub</a>
    </footer>
  </body>
</html>
